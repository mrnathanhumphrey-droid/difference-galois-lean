name = "difference_galois"
version = "0.1.0"
keywords = ["math", "difference-algebra", "picard-vessiot", "galois"]
defaultTargets = ["DiffGalois"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "DiffGalois"
